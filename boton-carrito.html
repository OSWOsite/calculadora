<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso al Carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0071c4;
    --gris: #666666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    /* Espacio a la derecha para que el globo no se corte; arriba solo un poco para el halo */
    padding: 6px 12px 8px 2px;
  }

  .contenedor {
    position: relative;
    width: 100%;
    max-width: 300px;
  }

  /* ---------- Botón (mismo diseño de los anteriores) ---------- */
  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 40px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid #c8c8c8;
    background: linear-gradient(180deg, #ffffff 0%, #eef5fb 100%);
    box-shadow:
      inset 0 1px 0 #ffffff,
      0 1px 2px rgba(0, 0, 0, .10),
      0 4px 10px -3px rgba(0, 0, 0, .22);
    color: var(--azul);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.1;
    white-space: nowrap;
    text-decoration: none;
    letter-spacing: .2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .boton:hover {
    background: linear-gradient(180deg, #1a86d6 0%, var(--azul) 100%);
    border-color: #a6a6a6;
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .25),
      0 6px 14px -4px rgba(0, 0, 0, .32);
  }
  .boton:active { transform: translateY(0); }
  .boton:focus-visible {
    outline: 3px solid rgba(0, 113, 196, .45);
    outline-offset: 2px;
  }

  .icono {
    width: 1.25em;
    height: 1.25em;
    flex: none;
    fill: currentColor;
  }

  /* ---------- Globo con el número de artículos ---------- */
  .globo {
    position: absolute;
    top: 50%;
    margin-top: -12px;      /* la mitad de la altura (24px) para centrarlo sin usar transform */
    right: 8px;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    background: var(--azul);
    border: 2px solid #ffffff;
    border-radius: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    pointer-events: none;
    box-shadow: 0 2px 5px rgba(0, 0, 0, .25);
  }
  .globo.activo {
    display: flex;
    animation: respirar 1.6s infinite ease-in-out;
  }
  /* Late más grande y emite un halo que se expande */
  @keyframes respirar {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .25), 0 0 0 0 rgba(0, 113, 196, .6);
    }
    50% {
      transform: scale(1.22);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .25), 0 0 0 8px rgba(0, 113, 196, 0);
    }
  }
  /* Al pasar el cursor el botón se pone azul: el globo se invierte para seguir destacando */
  .boton:hover + .globo {
    background: #ffffff;
    color: var(--azul);
    border-color: var(--azul);
  }

  /* Espacios angostos (por ejemplo, 2 barras de Google Sites) */
  @media (max-width: 200px) {
    .boton { font-size: 14px; padding: 6px 8px; min-height: 36px; gap: 6px; }
    .globo { min-width: 22px; height: 22px; margin-top: -11px; font-size: 12px; }
  }
  @media (max-width: 150px) {
    .boton { font-size: 13px; padding: 5px 6px; gap: 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .boton { transition: none; }
    .boton:hover { transform: none; }
    .globo.activo { animation: none; }
  }
</style>
</head>
<body>

<div class="contenedor">
  <a href="https://sites.google.com/view/oswocatlogo/carrito" target="_blank" rel="noopener noreferrer" class="boton" title="Ver mi carrito">
    <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
    <span>VER CARRITO</span>
  </a>
  <div class="globo" id="indicador-visual">0</div>
</div>

<script>
    const dbName = "CatalogoDB";
    let db = null;

    function conectarBaseDatos() {
        const request = indexedDB.open(dbName, 1);

        request.onsuccess = function(e) {
            db = e.target.result;
            verificarCarrito();
        };

        request.onerror = function() {
            console.error("Error al acceder a IndexedDB desde el botón.");
        };
    }

    function verificarCarrito() {
        if (!db) return;
        try {
            const transaction = db.transaction(["carrito"], "readonly");
            const store = transaction.objectStore("carrito");
            const requestGetAll = store.getAll();

            requestGetAll.onsuccess = function() {
                const globo = document.getElementById('indicador-visual');
                if (globo) {
                    const cantidadCodigos = requestGetAll.result ? requestGetAll.result.length : 0;

                    if (cantidadCodigos > 0) {
                        globo.textContent = cantidadCodigos; // Número de artículos diferentes
                        globo.classList.add('activo');
                    } else {
                        globo.classList.remove('activo');
                    }
                }
            };
        } catch (e) {
            console.log("Esperando inicialización completa de DB...");
        }
    }

    window.addEventListener('DOMContentLoaded', conectarBaseDatos);
    setInterval(verificarCarrito, 2000);
</script>
</body>
</html>
