<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botón Ver artículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0071c4;
    --gris: #666666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2px 2px 6px;
  }
  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 300px;
    min-height: 40px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid #c8c8c8;
    background: linear-gradient(180deg, #ffffff 0%, #eef5fb 100%);
    box-shadow:
      inset 0 1px 0 #ffffff,
      0 1px 2px rgba(0, 0, 0, .10),
      0 4px 10px -3px rgba(0, 0, 0, .22);
    color: var(--azul);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.1;
    white-space: nowrap;          /* evita que el texto se parta en dos líneas */
    text-decoration: none;
    letter-spacing: .2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .boton:hover {
    background: linear-gradient(180deg, #1a86d6 0%, var(--azul) 100%);
    border-color: #a6a6a6;
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .25),
      0 6px 14px -4px rgba(0, 0, 0, .32);
  }
  .boton:active { transform: translateY(0); }
  .boton:focus-visible {
    outline: 3px solid rgba(0, 113, 196, .45);
    outline-offset: 2px;
  }
  .sku {
    font-size: 13px;
    font-weight: 400;
    color: var(--gris);
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(0, 113, 196, .08);
    transition: color .18s ease, background .18s ease;
  }
  .boton:hover .sku {
    color: #ffffff;
    background: rgba(255, 255, 255, .2);
  }
  .sku:empty { display: none; }

  /* Espacios angostos (por ejemplo, 2 barras de Google Sites) */
  @media (max-width: 200px) {
    .boton { font-size: 14px; padding: 6px 8px; gap: 6px; min-height: 36px; }
    .sku { font-size: 12px; padding: 1px 6px; }
  }
  @media (max-width: 150px) {
    .boton { font-size: 13px; padding: 5px 6px; gap: 5px; }
    .sku { font-size: 11px; padding: 1px 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .boton, .sku { transition: none; }
    .boton:hover { transform: none; }
  }
</style>
</head>
<body>

<a id="boton" class="boton" href="https://sites.google.com/view/oswocatlogo" target="_blank" rel="noopener noreferrer">
  <span>Ver artículo</span>
  <span class="sku" id="sku"></span>
</a>

<script>
  // Base del catálogo en Google Sites. El SKU se agrega al final.
  var BASE = "https://sites.google.com/view/oswocatlogo/";

  // Lee el SKU de la URL: boton-articulo.html?sku=7  (o #7)
  var params = new URLSearchParams(window.location.search);
  var sku = (params.get("sku") || window.location.hash.replace("#", "")).trim();
  sku = sku.replace(/[^a-zA-Z0-9_-]/g, ""); // solo caracteres seguros

  var boton = document.getElementById("boton");
  if (sku) {
    boton.href = BASE + encodeURIComponent(sku);
    document.getElementById("sku").textContent = sku;
    boton.setAttribute("aria-label", "Ver artículo " + sku);
  }
</script>

</body>
</html>
