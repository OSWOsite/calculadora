<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Producto - Minimalista</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul: #0071c4;
            --gris: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            text-transform: uppercase;
        }

        body {
            background-color: #ffffff;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            /* TAMAÑO Y FORMATO ÚNICO para todos los textos (el título lo cambia aparte) */
            font-size: 16px;
            font-weight: 500;
        }

        button, input {
            font-size: inherit;
            font-weight: inherit;
        }

        .card {
            background: #ffffff;
            border-radius: 0;
            padding: 0 0 20px 0;
            max-width: 400px;
            width: 100%;
            box-shadow: none;
            border: none;
        }

        .info-producto {
            margin-bottom: 30px;
            text-align: left;
            min-height: 80px;
        }

        /* ÚNICO texto con tamaño distinto: el título */
        .categoria {
            font-size: 20px;
            font-weight: 400;
            color: var(--azul);
            margin-bottom: 6px;
        }

        .modelo {
            color: var(--gris);
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .precio-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            overflow: hidden;
        }

        .precio {
            color: var(--gris);
            font-size: 20px;
            transition: color 0.4s ease;
        }

        .precio.reducido {
            color: #cccccc;
        }

        .precio-entero-tachado {
            text-decoration: line-through;
        }

        .unidad { color: var(--gris); font-size: 16px; }
        .unidad.azul { color: var(--azul); }

        .precio-descuento-row {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .precio-descuento-row.visible {
            opacity: 1;
        }

        .precio-nuevo {
            color: var(--azul);
            font-size: 20px;
            white-space: nowrap;
        }

        .badge-descuento {
            color: #ffffff;
            background: var(--azul);
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .seccion-interactiva {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-cantidad {
            display: flex;
            background: transparent;
            padding: 15px 0;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* Líneas degradadas superior e inferior (reemplazan los bordes) */
        .panel-cantidad::before,
        .panel-cantidad::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0),
                #7b7b7b,
                rgba(255,255,255,0)
            );
        }
        .panel-cantidad::before { top: 0; }
        .panel-cantidad::after { bottom: 0; }

        .col-botones-canti {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 45%;
        }

        /* ---------- Diseño unificado de botones (cristal claro) ---------- */
        .btn-canti,
        .btn-accion {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 40px;
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid #c8c8c8;
            background: linear-gradient(180deg, #ffffff 0%, #eef5fb 100%);
            box-shadow:
                inset 0 1px 0 #ffffff,
                0 1px 2px rgba(0, 0, 0, .10),
                0 4px 10px -3px rgba(0, 0, 0, .22);
            color: var(--azul);
            line-height: 1.1;
            letter-spacing: .5px;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
        }
        .btn-canti:hover,
        .btn-accion:hover {
            background: linear-gradient(180deg, #1a86d6 0%, var(--azul) 100%);
            border-color: #a6a6a6;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .25),
                0 6px 14px -4px rgba(0, 0, 0, .32);
        }
        .btn-canti:active,
        .btn-accion:active { transform: translateY(0); }
        .btn-canti:focus-visible,
        .btn-accion:focus-visible {
            outline: 3px solid rgba(0, 113, 196, .45);
            outline-offset: 2px;
        }

        .btn-ws { margin-bottom: 4px; }

        /* Botón principal: azul sólido */
        .btn-cart {
            background: linear-gradient(180deg, #1a86d6 0%, var(--azul) 100%);
            border-color: #005fa3;
            color: #ffffff;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .25),
                0 1px 2px rgba(0, 0, 0, .15),
                0 4px 10px -3px rgba(0, 95, 163, .5);
        }
        .btn-cart:hover {
            background: linear-gradient(180deg, #0a7bd0 0%, #005fa3 100%);
            border-color: #004f88;
            color: #ffffff;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .2),
                0 6px 14px -4px rgba(0, 95, 163, .6);
        }


        .col-display-canti {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .label-canti {
            color: var(--gris);
            margin-bottom: 6px;
        }

        .input-canti {
            width: 100%;
            border: none;
            background: transparent;
            text-align: center;
            color: var(--azul);
            font-size: 20px;
        }
        .input-canti:focus { outline: none; }

        .input-canti::-webkit-outer-spin-button,
        .input-canti::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .aviso-wrapper {
            position: relative;
            height: 0;
            overflow: visible;
        }

        /* Estructura base unificada para todos los globos flotantes */
        .aviso-descuento {
            position: absolute;
            top: -2px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 6px;
            background: var(--azul);
            padding: 11px 14px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition: opacity 0.38s ease, transform 0.38s ease;
            z-index: 10;
        }

        .aviso-descuento.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .aviso-icono {
            flex-shrink: 0;
            line-height: 1;
        }

        .aviso-texto {
            color: #ffffff;
            letter-spacing: 0.3px;
            line-height: 1.35;
        }

        .aviso-texto strong {
            font-weight: inherit;
            color: #ffffff;
        }

        /* ===== TOTAL: mismas columnas que la cantidad ===== */
        .total-container {
            position: relative;
            overflow: visible;
            display: flex;
            align-items: center;
            margin: 10px 0 20px 0;
        }

        .total-label {
            width: 45%;              /* igual que la columna de botones */
            color: var(--gris);
            letter-spacing: 1px;
        }

        .total-val {
            flex: 1;                 /* igual que la columna de la cantidad */
            text-align: center;      /* queda centrado justo bajo el número de cantidad */
            color: var(--azul);
            font-size: 20px;
        }

        .decimales {
            font-size: 0.65em;
            vertical-align: super;
        }

        /* ===== FECHA DE ENTREGA (sin sombra) ===== */
        #oswo-ultra-minimal {
            width: 100%;
            margin: 0;
            padding: 28px 10px;
            box-sizing: border-box;
            background-color: #FFFFFF;
            color: var(--gris);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        /* Línea degradada superior */
        #oswo-ultra-minimal::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0),
                #7b7b7b,
                rgba(255,255,255,0)
            );
        }

        #oswo-ultra-minimal .fecha {
            display: block;
            margin-top: 8px;
            color: #b7b7b7;
            letter-spacing: 1px;
        }

        .error-msg {
            color: var(--gris);
            text-align: center;
            padding: 30px 0;
        }

        #loading {
            text-align: center;
            color: var(--gris);
            padding: 30px 0;
        }

        @media (max-width: 600px) {
            .card { padding: 0 0 15px 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-canti, .btn-accion, .aviso-descuento, .precio, .precio-descuento-row { transition: none; }
            .btn-canti:hover, .btn-accion:hover { transform: none; }
        }
    </style>
</head>
<body>

<div class="card" id="calc-container">
    <div id="loading">Cargando producto...</div>
</div>

<script>
    const TELEFONO_WHATSAPP = "525521133250";
    let productoActual = null;
    let cantidad = 1;
    let precioNumerico = 0;
    let umbralNumerico = 0;
    let descuentoPct = 0;
    let db = null;
    let avisoMostrado = false;
    let timeoutGlobo = null; // Guardará la referencia para limpiar animaciones previas

    function inicializarDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open("CatalogoDB", 1);
            request.onupgradeneeded = function(e) {
                const database = e.target.result;
                if (!database.objectStoreNames.contains("carrito")) {
                    database.createObjectStore("carrito", { keyPath: "codigo" });
                }
            };
            request.onsuccess = function(e) { db = e.target.result; resolve(db); };
            request.onerror = function(e) { reject(e.target.error); };
        });
    }

    function cargarProducto(idProducto) {
        const container = document.getElementById('calc-container');
        fetch('productos.json')
            .then(response => {
                if (!response.ok) throw new Error("Error al cargar JSON");
                return response.json();
            })
            .then(productosDB => {
                productoActual = productosDB.find(p => String(p.Código) === String(idProducto));
                if (productoActual) {
                    precioNumerico = parseFloat(productoActual.Precio.replace('$', '').replace(',', ''));
                    umbralNumerico = parseInt(productoActual.Umbral) || 0;
                    descuentoPct = parseFloat(productoActual.Descuento) || 0;
                    renderCalculadora();
                } else {
                    container.innerHTML = `<div class="error-msg">Código #${idProducto} no encontrado en inventario.</div>`;
                }
            })
            .catch(error => {
                container.innerHTML = `<div class="error-msg">Error de conexión o archivo productos.json ausente.</div>`;
                console.error(error);
            });
    }

    window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const idProducto = urlParams.get('id');
        const container = document.getElementById('calc-container');

        if (!idProducto) {
            container.innerHTML = `<div class="error-msg">Falta especificar el ID en la URL (?id=CODIGO)</div>`;
            return;
        }

        inicializarDB()
            .then(() => cargarProducto(idProducto))
            .catch(error => {
                container.innerHTML = `<div class="error-msg">Error de base de datos: ${error.message}</div>`;
            });
    });

    function renderCalculadora() {
        const container = document.getElementById('calc-container');
        const tieneDescuento = descuentoPct > 0 && umbralNumerico > 0;

        container.innerHTML = `
            <div class="info-producto">
                <div class="categoria">${productoActual.Categoria}</div>
                <div class="modelo">${productoActual.Modelo}</div>
                <div class="precio-wrapper">
                    <span class="precio" id="precio-base"><span id="precio-entero">${formatEntero(precioNumerico)}</span><span class="decimales" id="precio-cents">.${formatCents(precioNumerico)}</span> <span class="unidad">C/U</span></span>
                    ${tieneDescuento ? `
                    <div class="precio-descuento-row" id="precio-descuento-row">
                        <span class="precio-nuevo" id="precio-nuevo"></span>
                        <span class="badge-descuento" id="badge-desc"></span>
                    </div>
                    ` : ''}
                </div>
            </div>

            <div class="seccion-interactiva">
                <div class="panel-cantidad">
                    <div class="col-botones-canti">
                        <button class="btn-canti" onclick="modificarCantidad(1)" aria-label="Aumentar cantidad">+</button>
                        <button class="btn-canti" onclick="modificarCantidad(-1)" aria-label="Disminuir cantidad">-</button>
                    </div>
                    <div class="col-display-canti">
                        <span class="label-canti">Cantidad</span>
                        <input type="number" class="input-canti" id="cant-input" value="1" min="1" oninput="validarInput(this)">
                    </div>
                </div>

                <div class="aviso-wrapper">
                    <div class="aviso-descuento" id="aviso-desc">
                        <span class="aviso-icono" id="aviso-icono">🏷️</span>
                        <span class="aviso-texto" id="aviso-texto"></span>
                    </div>
                </div>

                <div class="total-container" style="margin-top: 10px;">
                    <span class="total-label">Total estimado:</span>
                    <span class="total-val" id="total-display">${formatMonto(precioNumerico)}</span>
                </div>

                <button class="btn-accion btn-ws" onclick="enviarWhatsApp()">
                    Pedir por WhatsApp
                </button>
                <button class="btn-accion btn-cart" onclick="agregarAlCarrito()">
                    Agregar al carrito
                </button>

                <div id="oswo-ultra-minimal">
                    <div class="texto">
                        PIDA HOY Y RECIBA EL
                        <span class="fecha" id="fecha-entrega"></span>
                    </div>
                </div>
            </div>
        `;

        actualizarUI();
        calcularProximoDiaHabil();
    }

    function formatMonto(monto) {
        const partes = monto.toFixed(2).split('.');
        const entero = parseFloat(partes[0]).toLocaleString('es-MX');
        const decimales = partes[1];
        return `${entero}<span class="decimales">.${decimales}</span>`;
    }

    function formatEntero(monto) {
        return parseFloat(monto.toFixed(2).split('.')[0]).toLocaleString('es-MX');
    }

    function formatCents(monto) {
        return monto.toFixed(2).split('.')[1];
    }

    function modificarCantidad(valor) {
        const input = document.getElementById('cant-input');
        let nuevaCantidad = (parseInt(input.value) || 1) + valor;
        if (nuevaCantidad < 1) nuevaCantidad = 1;
        input.value = nuevaCantidad;
        cantidad = nuevaCantidad;
        actualizarUI();
    }

    function validarInput(input) {
        let valor = parseInt(input.value);
        if (valor < 1 || isNaN(valor)) valor = 1;
        cantidad = valor;
        actualizarUI();
    }

    // Lógica encargada de gestionar la animación suave de salida para cualquier globo
    function lanzarGloboDinamico(texto, icono = "🏷️", duracion = 3500) {
        const avisoDesc = document.getElementById('aviso-desc');
        const avisoTexto = document.getElementById('aviso-texto');
        const avisoIcono = document.getElementById('aviso-icono');

        if (!avisoDesc) return;

        // Limpiamos timeouts previos si el usuario hace clics rápidos
        clearTimeout(timeoutGlobo);

        avisoIcono.textContent = icono;
        avisoTexto.innerHTML = texto;
        avisoDesc.classList.add('visible');

        // Se quita suavemente con la transición CSS tras completarse los segundos establecidos
        timeoutGlobo = setTimeout(() => {
            avisoDesc.classList.remove('visible');
        }, duracion);
    }

    function actualizarUI() {
        const tieneDescuento = descuentoPct > 0 && umbralNumerico > 0;
        const unidad = productoActual.Unidad || 'PIEZAS';
        const umbral75 = umbralNumerico * 0.75;
        const descuentoAplicado = tieneDescuento && cantidad >= umbralNumerico;

        const precioFinal = descuentoAplicado
            ? precioNumerico * (1 - descuentoPct / 100)
            : precioNumerico;

        const total = cantidad * precioFinal;
        document.getElementById('total-display').innerHTML = formatMonto(total);

        if (!tieneDescuento) return;

        const precioBase = document.getElementById('precio-base');
        const precioEntero = document.getElementById('precio-entero');
        const precioDesRow = document.getElementById('precio-descuento-row');
        const precioNuevo = document.getElementById('precio-nuevo');
        const badgeDesc = document.getElementById('badge-desc');

        if (descuentoAplicado) {
            precioBase.classList.add('reducido');
            precioEntero.classList.add('precio-entero-tachado');
            precioNuevo.innerHTML = formatMonto(precioFinal) + ' <span class="unidad azul">C/U</span>';
            badgeDesc.textContent = `-${descuentoPct}%`;
            precioDesRow.classList.add('visible');
        } else {
            precioBase.classList.remove('reducido');
            precioEntero.classList.remove('precio-entero-tachado');
            precioDesRow.classList.remove('visible');
        }

        const avisoDesc = document.getElementById('aviso-desc');

        // Modificación del aviso original de descuento para usar desvanecimiento controlado
        if (!descuentoAplicado && cantidad > umbral75 && !avisoMostrado) {
            const faltantes = umbralNumerico - cantidad;
            const textoMensaje = `Agregue <strong>${faltantes} ${unidad}</strong> para obtener un descuento del <strong>${descuentoPct}%</strong>`;

            lanzarGloboDinamico(textoMensaje, "🏷️", 4000);
            avisoMostrado = true;
        }

        if (descuentoAplicado && avisoDesc && avisoDesc.classList.contains('visible')) {
            avisoDesc.classList.remove('visible');
        }
    }

    function precioEfectivo() {
        const tieneDescuento = descuentoPct > 0 && umbralNumerico > 0;
        const descuentoAplicado = tieneDescuento && cantidad >= umbralNumerico;
        return descuentoAplicado ? precioNumerico * (1 - descuentoPct / 100) : precioNumerico;
    }

    function enviarWhatsApp() {
        const totalTexto = (cantidad * precioEfectivo()).toFixed(2);
        const mensaje = `Hola oswo, me interesa:\n${productoActual.Categoria} - ${productoActual.Modelo}\nCódigo: ${productoActual.Código}\nCantidad: ${cantidad} ${productoActual.Unidad || 'piezas'}\nTotal: $${totalTexto}\n¿Me confirmas disponibilidad?`;
        const urlWs = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
        window.open(urlWs, '_blank');
    }

    function agregarAlCarrito() {
        if (!db) {
            alert("BASE DE DATOS NO LISTA. Intenta de nuevo.");
            return;
        }

        const precio = precioEfectivo();
        const total = parseFloat((cantidad * precio).toFixed(2));

        const item = {
            codigo: String(productoActual.Código),
            categoria: productoActual.Categoria,
            modelo: productoActual.Modelo,
            cantidad: parseInt(cantidad),
            precioUnitario: precio,
            total: total,
            URL: productoActual.URL || '#',
            Unidad: productoActual.Unidad || 'PIEZAS'
        };

        const transaction = db.transaction(["carrito"], "readwrite");
        const store = transaction.objectStore("carrito");
        const requestAdd = store.put(item);

        requestAdd.onsuccess = function() {
            lanzarGloboDinamico("¡AGREGADO AL CARRITO CON ÉXITO!", "🛒", 3000);

            const input = document.getElementById('cant-input');
            input.value = 1;
            cantidad = 1;
            avisoMostrado = false; // Permite que se vuelva a recalcular alertas de umbrales
            actualizarUI();
        };

        requestAdd.onerror = function() {
            alert("Error al agregar al carrito: " + requestAdd.error);
        };
    }

    function calcularProximoDiaHabil() {
        const hoy = new Date();
        const diaSemana = hoy.getDay();
        if (diaSemana === 5) hoy.setDate(hoy.getDate() + 1);
        else if (diaSemana === 6) hoy.setDate(hoy.getDate() + 2);
        else hoy.setDate(hoy.getDate() + 1);

        const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
        const fechaFormateada = hoy.toLocaleDateString('es-ES', opciones).toUpperCase();

        const contenedorFecha = document.getElementById("fecha-entrega");
        if (contenedorFecha) {
            contenedorFecha.innerText = fechaFormateada;
        }
    }
</script>
</body>
</html>
